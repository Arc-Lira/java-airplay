plugins {
    id 'io.freefair.lombok' version '9.5.0'
    id 'com.adarshr.test-logger' version '4.0.0'
}

ext {
    springBootVersion = '4.0.7'
    springDepMgmtVersion = '1.1.7'
    junitVersion = '5.14.4'
    nettyVersion = '4.2.15.Final'
    slf4jVersion = '2.0.18'
    logbackVersion = '1.5.38'
    jnaVersion = '5.19.1'
    jmdnsVersion = '3.6.3'
    plistVersion = '1.26'
    eddsaVersion = '0.3.0'
    curve25519Version = '0.5.0'
    gstreamerCoreVersion = '1.4.0'
    gstreamerSwingVersion = '0.9.0'
}

allprojects {
    apply plugin: 'java'

    group = 'wtf.nanoka'
    version = providers.gradleProperty('version').getOrElse('1.1.1')

    repositories {
        mavenCentral()
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }
}

subprojects {
    apply plugin: 'io.freefair.lombok'
    apply plugin: 'com.adarshr.test-logger'

    dependencies {
        implementation "org.slf4j:slf4j-api:${rootProject.ext.slf4jVersion}"
        implementation "com.googlecode.plist:dd-plist:${rootProject.ext.plistVersion}"

        testImplementation(platform("org.junit:junit-bom:${rootProject.ext.junitVersion}"))
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    tasks.named('test') {
        useJUnitPlatform()
        jvmArgs '--enable-native-access=ALL-UNNAMED', '-Dio.netty.noUnsafe=true'
    }

    tasks.withType(JavaCompile).configureEach {
        options.release = 25
        options.encoding = 'UTF-8'
        options.compilerArgs.addAll(['-Xlint:deprecation', '-Xlint:unchecked'])
    }
}

wrapper {
    gradleVersion = '9.7.0'
    distributionType = Wrapper.DistributionType.BIN
}

def windows = System.getProperty('os.name').toLowerCase().contains('windows')
def releaseOutputDirectory = layout.projectDirectory.dir('release')
def releaseBuildDate = providers.provider {
    new Date().format('yyMMdd', TimeZone.getTimeZone('UTC'))
}
def releaseVersion = releaseBuildDate.map { date -> "${project.version}.${date}" }
def releaseJlinkModules = 'java.se,jdk.unsupported,jdk.crypto.ec,jdk.crypto.cryptoki,jdk.localedata,jdk.charsets'
def releaseJdkLauncher = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(25)
}
def windowsReleaseArchitectures = [
        [id: 'X64', gst: 'x86_64', zip: 'windows-x64'],
        [id: 'Arm64', gst: 'arm64', zip: 'windows-arm64']
]
def releaseTestTasks = subprojects.collect { "${it.path}:test" }

windowsReleaseArchitectures.each { arch ->
    def runtimeDirectory = layout.buildDirectory.dir("release/${arch.zip}/runtime")
    def gstreamerDirectory = arch.gst == 'x86_64'
            ? layout.projectDirectory.dir('.runtime/gstreamer')
            : layout.projectDirectory.dir(".runtime/gstreamer-${arch.gst}")
    def jdkDirectory = layout.projectDirectory.dir(".runtime/jdk-windows-${arch.gst}")
    def releaseBaseName = releaseVersion.map { value -> "java-airplay-${value}-${arch.zip}" }
    def checksumFile = providers.provider {
        new File(releaseOutputDirectory.asFile, "${releaseBaseName.get()}.zip.sha256")
    }

    tasks.register("prepareGStreamerRuntime${arch.id}", Exec) {
        group = 'distribution'
        description = "Checks or prepares the project-local Windows ${arch.zip} GStreamer runtime."
        doFirst {
            if (!windows) {
                throw new GradleException("The ${arch.zip} release must be built on Windows.")
            }
        }
        commandLine 'powershell.exe', '-NoLogo', '-NoProfile', '-ExecutionPolicy', 'Bypass',
                '-File', layout.projectDirectory.file('scripts/bootstrap-runtime.ps1').asFile.absolutePath,
                '-Architecture', arch.gst
        outputs.upToDateWhen { false }
    }

    tasks.register("prepareReleaseJdk${arch.id}", Exec) {
        group = 'distribution'
        description = "Prepares JDK 25 jmods for the ${arch.zip} runtime."
        doFirst {
            if (!windows) {
                throw new GradleException("The ${arch.zip} release must be built on Windows.")
            }
        }
        commandLine 'powershell.exe', '-NoLogo', '-NoProfile', '-ExecutionPolicy', 'Bypass',
                '-File', layout.projectDirectory.file('scripts/prepare-release-jdk.ps1').asFile.absolutePath,
                '-Architecture', arch.gst
        outputs.upToDateWhen { false }
    }

    tasks.register("cleanReleaseJavaRuntime${arch.id}", Delete) {
        group = 'distribution'
        delete runtimeDirectory
    }

    tasks.register("createReleaseJavaRuntime${arch.id}", Exec) {
        group = 'distribution'
        description = "Creates a compact Java 25 runtime for the ${arch.zip} release."
        dependsOn "cleanReleaseJavaRuntime${arch.id}", "prepareReleaseJdk${arch.id}"
        inputs.property('javaVersion', 25)
        inputs.property('architecture', arch.gst)
        doFirst {
            if (!windows) {
                throw new GradleException("The ${arch.zip} release must be built on Windows.")
            }
            def hostJavaHome = releaseJdkLauncher.get().metadata.installationPath.asFile
            def jmods = new File(jdkDirectory.asFile, 'jmods')
            if (!jmods.directory) {
                throw new GradleException("Target JDK jmods were not found at ${jmods}.")
            }
            executable = new File(hostJavaHome, 'bin/jlink.exe').absolutePath
            args '--module-path', jmods.absolutePath,
                    '--add-modules', releaseJlinkModules,
                    '--ignore-signing-information',
                    '--strip-debug', '--no-header-files', '--no-man-pages', '--compress', 'zip-6',
                    '--output', runtimeDirectory.get().asFile.absolutePath
        }
    }

    tasks.register("releaseWindows${arch.id}", Zip) {
        group = 'distribution'
        description = "Builds the complete, end-user-ready ${arch.zip} ZIP distribution."
        dependsOn ':player:app:bootJar', "prepareGStreamerRuntime${arch.id}",
                "createReleaseJavaRuntime${arch.id}", releaseTestTasks

        archiveFileName = releaseBaseName.map { "${it}.zip" }
        destinationDirectory = releaseOutputDirectory
        outputs.file(checksumFile)
        zip64 = true
        includeEmptyDirs = false

        into(releaseBaseName) {
            from(layout.projectDirectory.file("player/app/build/libs/java-airplay-server-${project.version}.jar"))
            from('start.bat')
            from('scripts') {
                into 'scripts'
            }
            from('README.md', 'README.zh-CN.md', 'LICENSE')
            from('config/application.example.properties') {
                into 'config'
            }
            from('config/application.example.properties') {
                into 'config'
                rename { 'application.properties' }
            }
            from(runtimeDirectory) {
                into 'runtime'
            }
            from(gstreamerDirectory) {
                into '.runtime/gstreamer'
                include 'bin/**'
                include 'lib/**/*.dll'
                include 'libexec/**'
                include 'etc/**'
                include 'share/**'
            }
        }

        doLast {
            def zipFile = archiveFile.get().asFile
            def digest = java.security.MessageDigest.getInstance('SHA-256')
            zipFile.withInputStream { input ->
                byte[] buffer = new byte[1024 * 1024]
                int read
                while ((read = input.read(buffer)) != -1) {
                    digest.update(buffer, 0, read)
                }
            }
            def checksum = digest.digest().collect { String.format('%02x', it) }.join()
            def output = checksumFile.get()
            output.setText("${checksum}  ${zipFile.name}\n", 'UTF-8')
            logger.lifecycle("Release created: ${zipFile}")
            logger.lifecycle("SHA-256: ${checksum}")
        }
    }
}

tasks.register('prepareGStreamerRuntime') {
    group = 'distribution'
    description = 'Checks or prepares the project-local Windows x64 GStreamer runtime.'
    dependsOn 'prepareGStreamerRuntimeX64'
}

tasks.register('release') {
    group = 'distribution'
    description = 'Builds the complete Windows x64 and ARM64 ZIP distributions.'
    dependsOn 'releaseWindowsX64', 'releaseWindowsArm64'
}
